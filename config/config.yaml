models:
  embedding:
    provider: huggingface
    model: Qwen/Qwen3-Embedding-0.6B
    device: cpu
    trust_remote_code: true
    query_prompt_name: query
  reranker:
    provider: huggingface
    model: Qwen/Qwen3-Reranker-0.6B
    device: cpu
    trust_remote_code: true
  generation:
    provider: bedrock
    vendor: google
    model: google.gemma-3-4b-it
    max_tokens: 800
    temperature: 0.1
    top_p: 0.9

aws:
  region: ap-southeast-2
  connect_timeout_seconds: 5
  read_timeout_seconds: 120
  retry_mode: standard
  total_max_attempts: 3
  tcp_keepalive: true

database:
  url: null

runtime:
  profile: fixture

managed_ingestion:
  corpus_key: consumer-finance-managed
  qdrant_collection_prefix: consumer_finance_managed

managed_index:
  format_version: managed-hybrid-index-v1
  dense_vector_name: dense_hnsw
  sparse_vector_name: sparse_bm25
  distance_metric: cosine
  hnsw_m: 16
  hnsw_ef_construct: 100
  bm25_k1: 1.2
  bm25_b: 0.75
  sparse_modifier: none
  sparse_on_disk: false
  retained_retired_generations: 2
  retired_cleanup_min_age_hours: 24
  dense_reuse_read_max_attempts: 3
  dense_reuse_read_backoff_seconds: 0.25

qdrant:
  url: http://localhost:6333
  collection_name: consumer_finance_phase1
  dense_vector_name: dense_hnsw
  sparse_vector_name: sparse_bm25
  hnsw_m: 16
  hnsw_ef_construct: 100

chunking:
  chunk_size: 900
  overlap: 120

retrieval:
  dense_candidates: 20
  sparse_candidates: 20
  fused_candidates: 12
  final_contexts: 5
  rrf_k: 60
  hnsw_ef: null

context:
  max_characters: 12000

public_showcase:
  enabled: false
  inference_enabled: false
  approved_corpus_key: consumer-finance-managed
  max_question_characters: 500
  max_requests_per_window: 20
  rate_window_seconds: 3600
  max_concurrent_requests: 2

private_workbench:
  automatic_evaluation_enabled: true
  default_mlflow_judges: true
  default_ragas: true
  default_save_to_mlflow: true
  max_evaluation_cases: 2
  judge_call_debug_directory: reports/evaluation/private_judge_calls
  judge_call_debug_retention_hours: 24
  judge_profiles:
    - name: GPT-OSS 20B (development default)
      configuration_uri: bedrock:/openai.gpt-oss-20b-1:0
      region: ap-southeast-2
    - name: Llama 3 70B (historical baseline)
      configuration_uri: bedrock:/meta.llama3-70b-instruct-v1:0
      region: us-east-1

# These policy versions and thresholds are configuration, not universal production
# truth. Validate them against reviewed cases and human feedback before deployment.
quality_policy:
  default_profile: STANDARD
  standard:
    version: standard-v1
    require_evidence: true
    require_relevant_evidence: true
    relevance_policy_version: cross-encoder-reviewed-fixture-candidate-v1
    minimum_relevance_score: 0.0
    require_valid_citations: true
    reference_free_judge_enabled: false
    judge_timeout_seconds: 8
    judge_budget_usd: 0.01
    judge_failure_behavior: REVIEW_REQUIRED
    high_risk_financial_behavior: REVIEW_REQUIRED
  strict:
    version: strict-groundedness-candidate-v1
    require_evidence: true
    require_relevant_evidence: true
    relevance_policy_version: cross-encoder-reviewed-fixture-candidate-v1
    minimum_relevance_score: 0.0
    require_valid_citations: true
    reference_free_judge_enabled: true
    judge_model_id: openai.gpt-oss-20b-1:0
    judge_region: ap-southeast-2
    groundedness_threshold: 0.80
    judge_timeout_seconds: 8
    judge_max_input_tokens: 8192
    judge_max_output_tokens: 1024
    judge_max_retries: 0
    judge_budget_usd: 0.01
    judge_failure_behavior: REVIEW_REQUIRED
    judge_timeout_behavior: ABSTAIN
    high_risk_financial_behavior: REVIEW_REQUIRED
  evaluation:
    version: evaluation-v1
    require_evidence: true
    require_relevant_evidence: true
    relevance_policy_version: cross-encoder-reviewed-fixture-candidate-v1
    minimum_relevance_score: 0.0
    require_valid_citations: true
    reference_free_judge_enabled: true
    judge_timeout_seconds: 30
    judge_budget_usd: 0.10
    judge_failure_behavior: REVIEW_REQUIRED
    high_risk_financial_behavior: REVIEW_REQUIRED

online_monitoring:
  enabled: false
  approved_data_handling: false
  sample_rate: 0.0
  max_concurrency: 1
  daily_budget_usd: 0.0

drift_monitoring:
  max_recall_drop: 0.0
  max_mrr_drop: 0.0
  max_answer_metric_drop: 0.0
  minimum_operational_samples: 20
  max_failure_rate_increase: 0.05
  max_mean_latency_increase_ratio: 0.25

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  experiment_name: consumer-finance-rag
  evaluation_experiment_name: consumer-finance-rag-evaluation
  evaluation_dataset_name: consumer-finance-seed-evaluation-v1
  judge_model: bedrock:/openai.gpt-oss-20b-1:0
  judge_region: ap-southeast-2
  ragas_judge_max_tokens: 1024
  ragas_context_precision_max_tokens: 2048
  report_directory: reports/evaluation

evaluation:
  dataset_path: data/evaluation/seed_cases.json
  managed_dataset_path: data/evaluation/managed_public_cases.json
  dataset_name: consumer-finance-seed-evaluation
  dataset_version: "1.0"
  qdrant_collection_name: consumer_finance_evaluation
  bm25_state_path: data/index/evaluation_bm25_state.json
  k_values: [1, 3, 5, 10]

corpus_expansion:
  manifest_path: data/corpus_manifest.json
  cache_directory: data/evaluation_corpus/cache
  output_path: data/evaluation_corpus/cfpb_evaluation_corpus.json
  request_timeout_seconds: 30

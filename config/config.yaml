models:
  embedding:
    provider: huggingface
    model: Qwen/Qwen3-Embedding-0.6B
    device: cpu
    trust_remote_code: true
    query_prompt_name: query
  reranker:
    provider: huggingface
    model: Qwen/Qwen3-Reranker-0.6B
    device: cpu
    trust_remote_code: true
  generation:
    provider: bedrock
    vendor: anthropic
    model: null
    max_tokens: 800
    temperature: 0.1
    top_p: 0.9

aws:
  region: us-east-1
  connect_timeout_seconds: 5
  read_timeout_seconds: 120
  retry_mode: standard
  total_max_attempts: 3
  tcp_keepalive: true

database:
  url: null

runtime:
  profile: fixture

managed_ingestion:
  corpus_key: consumer-finance-managed
  qdrant_collection_prefix: consumer_finance_managed

managed_index:
  format_version: managed-hybrid-index-v1
  dense_vector_name: dense_hnsw
  sparse_vector_name: sparse_bm25
  distance_metric: cosine
  hnsw_m: 16
  hnsw_ef_construct: 100
  bm25_k1: 1.2
  bm25_b: 0.75
  sparse_modifier: none
  sparse_on_disk: false

qdrant:
  url: http://localhost:6333
  collection_name: consumer_finance_phase1
  dense_vector_name: dense_hnsw
  sparse_vector_name: sparse_bm25
  hnsw_m: 16
  hnsw_ef_construct: 100

chunking:
  chunk_size: 900
  overlap: 120

retrieval:
  dense_candidates: 20
  sparse_candidates: 20
  fused_candidates: 12
  final_contexts: 5
  rrf_k: 60
  hnsw_ef: null

context:
  max_characters: 12000

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  experiment_name: consumer-finance-rag
  evaluation_experiment_name: consumer-finance-rag-evaluation
  evaluation_dataset_name: consumer-finance-seed-evaluation-v1
  judge_model: null
  report_directory: reports/evaluation

evaluation:
  dataset_path: data/evaluation/seed_cases.json
  dataset_name: consumer-finance-seed-evaluation
  dataset_version: "1.0"
  qdrant_collection_name: consumer_finance_evaluation
  bm25_state_path: data/index/evaluation_bm25_state.json
  k_values: [1, 3, 5, 10]

corpus_expansion:
  manifest_path: data/corpus_manifest.json
  cache_directory: data/evaluation_corpus/cache
  output_path: data/evaluation_corpus/cfpb_evaluation_corpus.json
  request_timeout_seconds: 30

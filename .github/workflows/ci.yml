name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy .

      - name: Run offline regression suite
        run: uv run --frozen pytest

      - name: Validate Docker Compose configuration
        env:
          LINEAGE_DB_NAME: lineage_ci_placeholder
          LINEAGE_DB_PASSWORD: ci-placeholder-not-a-secret
          LINEAGE_DB_USER: lineage_ci_placeholder
          MLFLOW_DB_NAME: mlflow_ci_placeholder
          MLFLOW_DB_PASSWORD: ci-placeholder-not-a-secret
          MLFLOW_DB_USER: mlflow_ci_placeholder
        run: docker compose config --quiet

      - name: Verify checks did not modify tracked files
        run: git diff --check && test -z "$(git status --short)"

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:?set MLFLOW_DB_USER in .env}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    environment:
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:?set MLFLOW_DB_USER in .env}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
    command:
      - /bin/sh
      - -c
      - >-
        exec mlflow server --host=0.0.0.0 --port=5000
        --backend-store-uri="postgresql+psycopg://$${MLFLOW_DB_USER}:$${MLFLOW_DB_PASSWORD}@postgres:5432/$${MLFLOW_DB_NAME}"
        --artifacts-destination=/mlartifacts --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  qdrant_data:
  mlflow_postgres_data:
  mlflow_artifacts:


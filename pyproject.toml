[project]
name = "consumer-finance-rag"
version = "0.1.0"
description = "Evidence-grounded U.S. consumer finance intelligence using hybrid Qdrant retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "qdrant-client>=1.15,<2",
    "sentence-transformers>=6,<7",
    "streamlit>=1.63,<2",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime]>=1.40",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer_finance_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "app", "tests"]
exclude = ['\.venv']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
